<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halo · Live Listen</title><link rel="stylesheet" href="player.css"><script src="player.js" type="module"></script><main><p class="eyebrow">HALO · LIVE LISTEN</p><h1>Your session, heard clearly.</h1><p>This local player receives audio only while a producer has opened a room and enabled the VST3. No audio is saved.</p><section aria-labelledby="producer-title"><h2 id="producer-title">Producer</h2><form id="pair-form"><label>Code from the relay window<input id="pair-code" inputmode="numeric" pattern="[0-9]{6}" required maxlength="6" autocomplete="off"></label><button>Pair producer controls</button></form><button id="create" disabled>Open a listening room</button><button id="revoke" disabled>Revoke room</button><label>Listener link<input id="invite" readonly></label><img id="qr" alt="Listening room QR code" hidden><p id="network">The link works on this PC only unless an HTTPS listener is configured.</p></section><section aria-labelledby="listener-title"><h2 id="listener-title">Listener</h2><label>Room token<input id="room-token" type="password" autocomplete="off"></label><button id="listen">Start listening</button><button id="stop" disabled>Stop listening</button><label>Volume<input id="volume" type="range" min="0" max="1" step="0.05" value="0.7"></label></section><p id="status" role="status" aria-live="polite">Disconnected. Pair or enter a room token.</p><p id="metrics"></p></main></html>
